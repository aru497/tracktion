  <style>
    @keyframes spin4wd { to { transform: rotate(360deg); } }

    .boot .stackc { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .boot .ringwrap { position: relative; width: 92px; height: 92px; }
    .boot .ring { position: absolute; inset: 0; border-radius: 999px; border: 3px solid #E7E3DC; border-top-color: #B4460E; animation: spin4wd 0.9s linear infinite; }

    .boot .t { font-family: system-ui; font-weight: 600; color: #55514A; letter-spacing: -0.01em; }
